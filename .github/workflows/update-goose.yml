name: Auto-update Goose AUR package

on:
  schedule:
    - cron: "0 17 * * *" # daily at 5 PM UTC (1 PM EST/EDT)
  workflow_dispatch: # allows manual triggering

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Configure git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          


      - name: Run in Arch Linux container
        run: |
          # Pull the Arch Linux image
          docker pull archlinux:latest
          
          # Create a script to run inside the container
          cat > update_script.sh << 'EOF'
          #!/bin/bash
          
          # Install required tools in Arch container
          pacman -Sy --noconfirm base-devel git wget jq pacman-contrib
          
          # Create a non-root user for makepkg
          useradd -m -U -s /bin/bash builduser
          chown -R builduser:builduser /github/workspace
          
          # Get latest Goose release version
          ver=$(curl -s https://api.github.com/repos/block/goose/releases/latest | jq -r .tag_name | sed 's/^v//')
          echo "Latest Goose version: $ver"

          # Check if version has changed before updating pkgrel
          current_ver=$(grep "^pkgver=" /github/workspace/PKGBUILD | cut -d'=' -f2)
          echo "Current version in PKGBUILD: $current_ver"
          
          # Only update if version has actually changed
          if [ "$ver" != "$current_ver" ]; then
            echo "Version changed from $current_ver to $ver, updating PKGBUILD"
            # Update PKGBUILD version and source URL
            sed -i "s/^pkgver=.*/pkgver=$ver/" /github/workspace/PKGBUILD
            sed -i "s#source=.*#source=(\\\"goose_${ver}_amd64.deb::https://github.com/block/goose/releases/download/v${ver}/goose_${ver}_amd64.deb\\\")#" /github/workspace/PKGBUILD
            # Reset pkgrel to 1 when version changes
            sed -i "s/^pkgrel=.*/pkgrel=1/" /github/workspace/PKGBUILD
            echo "Updated PKGBUILD with new version and reset pkgrel to 1"
          else
            echo "Version unchanged, no update needed"
            exit 0
          fi

          # Run updpkgsums and makepkg as non-root user
          cd /github/workspace
          sudo -u builduser updpkgsums
          sudo -u builduser makepkg --printsrcinfo > .SRCINFO
          EOF
          
          chmod +x update_script.sh
          
          # Run the script inside the container
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/github/workspace" \
            -v "$PWD/update_script.sh:/update_script.sh" \
            -w /github/workspace \
            archlinux:latest \
            /update_script.sh
          
          # Fix permissions and clean up
          sudo chown -R $(id -u):$(id -g) "$GITHUB_WORKSPACE"
          rm -f update_script.sh

      - name: Get version for commit message
        id: get_version
        run: |
          VERSION=$(grep "^pkgver=" PKGBUILD | cut -d'=' -f2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          
      - name: Commit & push changes
        run: |
          git remote -v
          git status
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo "No updates needed."
            exit 0
          fi
          git commit -m "bump version to ${{ steps.get_version.outputs.version }} and update source"
          git push origin master
